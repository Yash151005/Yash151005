<text x="208" y="116" font-size="10" fill="#e8eefc" class="st1">on-screen</text>
<text x="208" y="116" font-size="10" fill="#fbbf24" class="st2">off-screen</text>
<text x="22" y="70" font-size="8.5" letter-spacing="1.2" fill="#8b9bc2">CAM 01</text>
<circle cx="26" cy="82" r="3.5" fill="#fb7185" class="pulse"/><text x="34" y="85" font-size="9" fill="#e8eefc">LIVE</text>
<g class="scan"><rect x="16" y="20" width="268" height="2" fill="#2dd4bf" opacity="0.6" filter="url(#glow)"/></g>
</g>
