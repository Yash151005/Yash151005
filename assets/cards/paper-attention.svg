<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="250" viewBox="0 0 1000 250" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#050a18"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1d2b4f" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>

<defs>
  <clipPath id="cf"><rect x="1" y="1" width="998" height="248" rx="18"/></clipPath>
  <linearGradient id="shG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="haloG" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#00629B" stop-opacity="0.22"/><stop offset="1" stop-color="#00629B" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .sh{animation:sh 6s ease-in-out infinite;animation-delay:0.00s}
  @keyframes sh{0%{transform:translateX(-500px)}55%,100%{transform:translateX(1060px)}}
  .trace{animation:tr 7s linear infinite;animation-delay:-0.00s}
  @keyframes tr{from{stroke-dashoffset:2500}to{stroke-dashoffset:0}}
  .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pl 1.8s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
  .ring{transform-box:fill-box;transform-origin:center;animation:rg 2.2s ease-out infinite}
  @keyframes rg{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .ar{animation:ar 1.6s ease-in-out infinite}
  @keyframes ar{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
</style>
<g clip-path="url(#cf)">
  <rect width="1000" height="250" fill="url(#panelG)"/>
  <rect width="1000" height="250" fill="url(#grid)" opacity="0.45"/>
  <rect width="1000" height="250" fill="url(#haloG)"/>
  <rect class="sh" x="0" y="0" width="333" height="250" fill="url(#shG)"/>
</g>
<rect x="1" y="1" width="998" height="248" rx="18" fill="none" stroke="#1d2b4f" stroke-width="1.2"/>
<rect class="trace" x="1" y="1" width="998" height="248" rx="18" fill="none" stroke="#00629B" stroke-width="1.8"
      stroke-dasharray="220 2280" stroke-linecap="round" filter="url(#glow)"/>
<style>
  .btn{animation:bt 2.4s ease-in-out infinite}
  @keyframes bt{0%,100%{fill-opacity:.12}50%{fill-opacity:.32}}
  .seal{transform-box:fill-box;transform-origin:center;animation:sp 14s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<g transform="translate(28 28)">
  <rect width="300" height="194" rx="12" fill="#050a18" fill-opacity="0.7" stroke="#1d2b4f"/>
  
<style>
  .look{animation:lk 5s ease-in-out infinite}
  @keyframes lk{0%,40%{transform:translateX(0)}50%,65%{transform:translateX(7px)}75%,100%{transform:translateX(0)}}
  .blinkeye{transform-box:fill-box;transform-origin:center;animation:be 4s ease-in-out infinite}
  @keyframes be{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
  .meter{transform-box:fill-box;transform-origin:left;animation:mt 5s ease-in-out infinite}
  @keyframes mt{0%,40%{transform:scaleX(.92)}50%,65%{transform:scaleX(.38)}75%,100%{transform:scaleX(.92)}}
  .st1{animation:s1 5s steps(1) infinite}.st2{animation:s2 5s steps(1) infinite}
  @keyframes s1{0%{opacity:1}48%{opacity:0}70%{opacity:1}}
  @keyframes s2{0%{opacity:0}48%{opacity:1}70%{opacity:0}}
  .scan{animation:scn 3s ease-in-out infinite}
  @keyframes scn{0%,100%{transform:translateY(0)}50%{transform:translateY(150px)}}
</style>
