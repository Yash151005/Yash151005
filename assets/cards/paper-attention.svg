<text x="360" y="134" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b8c4e0" class="in" style="animation-delay:0.40s">Real-Time Classroom Engagement Monitoring Using Computer Vision</text><text x="360" y="153" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#b8c4e0" class="in" style="animation-delay:0.50s">and Deep Learning.</text>
<g class="in" style="animation-delay:.6s"><rect x="360.0" y="190" width="120.3" height="22" rx="11.0" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="420.1" y="205.0" text-anchor="middle" font-size="11" fill="#e8eefc">Computer Vision</text><rect x="488.3" y="190" width="106.7" height="22" rx="11.0" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="541.6" y="205.0" text-anchor="middle" font-size="11" fill="#e8eefc">Deep Learning</text><rect x="603.0" y="190" width="79.4" height="22" rx="11.0" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-opacity="0.55"/><text x="642.7" y="205.0" text-anchor="middle" font-size="11" fill="#e8eefc">Real-Time</text></g>
<g transform="translate(908 92)">
