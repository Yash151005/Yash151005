<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="64" viewBox="0 0 1000 64" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#050a18"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1d2b4f" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>
<style>
  .mv{animation:mv 4.5s ease-in-out infinite}
  @keyframes mv{0%{transform:translateX(0)}50%{transform:translateX(680px)}100%{transform:translateX(0)}}
  .gl{transform-box:fill-box;transform-origin:center;animation:gl 3s ease-in-out infinite}
  @keyframes gl{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.1)}}
  .tick{animation:tk 1.2s steps(1) infinite}@keyframes tk{50%{opacity:0}}
</style>
<rect x="1" y="1" width="998" height="62" rx="12" fill="url(#panelG)"/>
<rect x="1" y="1" width="998" height="62" rx="12" fill="url(#grid)" opacity="0.4"/>
<rect x="1" y="1" width="998" height="62" rx="12" fill="none" stroke="#3b82f6" stroke-opacity="0.45"/>
<rect x="16" y="14" width="36" height="36" rx="9" fill="#3b82f6" fill-opacity="0.14" stroke="#3b82f6"/>
<text x="34" y="39" text-anchor="middle" font-size="19" fill="#3b82f6" class="gl">◈</text>
<text x="68" y="31" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#e8eefc">AI ENGINEERING</text>
<text x="68" y="49" font-size="11" letter-spacing="1.5" fill="#8b9bc2">// agents · LLMs · RAG<tspan fill="#3b82f6" class="tick"> _</tspan></text>
<text x="976" y="38" text-anchor="end" font-size="12" letter-spacing="2.4" fill="#3b82f6">04 BUILDS</text>
<rect x="300" y="58" width="680" height="1" fill="#1d2b4f"/>
<g class="mv"><rect x="300" y="57" width="60" height="3" rx="1.5" fill="#3b82f6" filter="url(#glow)"/></g>
</svg>
