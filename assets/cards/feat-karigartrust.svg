<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="260" viewBox="0 0 500 260" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#050a18"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1d2b4f" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>

<defs>
  <clipPath id="cf"><rect x="1" y="1" width="498" height="258" rx="16"/></clipPath>
  <linearGradient id="shG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="haloG" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#fbbf24" stop-opacity="0.22"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .sh{animation:sh 6s ease-in-out infinite;animation-delay:0.70s}
  @keyframes sh{0%{transform:translateX(-250px)}55%,100%{transform:translateX(560px)}}
  .trace{animation:tr 7s linear infinite;animation-delay:-1.40s}
  @keyframes tr{from{stroke-dashoffset:1520}to{stroke-dashoffset:0}}
  .in{animation:in .8s cubic-bezier(.2,.7,.2,1) both}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .pulse{animation:pl 1.8s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
  .ring{transform-box:fill-box;transform-origin:center;animation:rg 2.2s ease-out infinite}
  @keyframes rg{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
  .ar{animation:ar 1.6s ease-in-out infinite}
  @keyframes ar{0%,100%{transform:translate(0,0)}50%{transform:translate(3px,-3px)}}
</style>
<g clip-path="url(#cf)">
  <rect width="500" height="260" fill="url(#panelG)"/>
  <rect width="500" height="260" fill="url(#grid)" opacity="0.45"/>
  <rect width="500" height="260" fill="url(#haloG)"/>
  <rect class="sh" x="0" y="0" width="166" height="260" fill="url(#shG)"/>
</g>
<rect x="1" y="1" width="498" height="258" rx="16" fill="none" stroke="#1d2b4f" stroke-width="1.2"/>
<rect class="trace" x="1" y="1" width="498" height="258" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.8"
      stroke-dasharray="140 1380" stroke-linecap="round" filter="url(#glow)"/>
<rect x="22" y="22" width="4" height="16" rx="2" fill="#fbbf24"/>
<text x="34" y="35" font-size="11" letter-spacing="2.2" fill="#fbbf24">SOFTWARE &amp; COMPUTER VISION</text>
<text x="474" y="35" text-anchor="end" font-size="11" letter-spacing="2" fill="#8b9bc2">10 / 12</text>
<line x1="22" y1="50" x2="478" y2="50" stroke="#1d2b4f"/>
<g transform="translate(374 62)">
  <rect x="0" y="0" width="100" height="90" rx="10" fill="#050a18" fill-opacity="0.65" stroke="#1d2b4f"/>
  
<style>
  .sc{animation:sc 2.6s ease-in-out infinite}
  @keyframes sc{0%,100%{transform:translateY(0)}50%{transform:translateY(70px)}}
  .lock{transform-box:fill-box;transform-origin:center;animation:lk 2.6s ease-in-out infinite}
  @keyframes lk{0%,20%{opacity:0;transform:scale(1.5)}40%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
</style>
<path d="M6 18V6H18 M82 6H94V18 M94 72V84H82 M18 84H6V72" fill="none" stroke="#fbbf24" stroke-width="2"/>
<rect x="30" y="38" width="40" height="22" rx="5" fill="#4b5a80" fill-opacity="0.6"/>
<circle cx="38" cy="62" r="5" fill="#4b5a80"/><circle cx="62" cy="62" r="5" fill="#4b5a80"/>
<rect x="38" y="30" width="22" height="10" rx="3" fill="#4b5a80" fill-opacity="0.6"/>
<g class="lock"><rect x="24" y="24" width="52" height="46" fill="none" stroke="#2dd4bf" stroke-width="1.6" stroke-dasharray="5 3"/>
<rect x="24" y="15" width="34" height="9" fill="#2dd4bf"/><text x="27" y="22" font-size="7" fill="#050a18">DETECT</text></g>
<g class="sc"><rect x="8" y="8" width="84" height="2" fill="#fbbf24" filter="url(#glow)"/></g>
</g>
<text x="24" y="98" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="700" fill="#e8eefc" class="in" style="animation-delay:.15s">KarigarTrust</text>
<rect x="26" y="108" width="60" height="2.5" rx="1.2" fill="#fbbf24" class="in" style="animation-delay:.25s"/>
<text x="26" y="132" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.35s">Agentic two-sided gold ledger for jewellers</text><text x="26" y="153" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.47s">and goldsmiths: issued, returned, wasted,</text><text x="26" y="174" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.59s">settled, both verified.</text>
<g class="in" style="animation-delay:.75s"><rect x="26.0" y="196" width="86.2" height="22" rx="11.0" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55"/><text x="69.1" y="211.0" text-anchor="middle" font-size="11" fill="#e8eefc">Agentic AI</text><rect x="120.2" y="196" width="58.9" height="22" rx="11.0" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55"/><text x="149.7" y="211.0" text-anchor="middle" font-size="11" fill="#e8eefc">Ledger</text><rect x="187.1" y="196" width="65.7" height="22" rx="11.0" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.55"/><text x="220.0" y="211.0" text-anchor="middle" font-size="11" fill="#e8eefc">Fintech</text></g>
<line x1="22" y1="232" x2="478" y2="232" stroke="#1d2b4f" stroke-dasharray="2 4"/>
<circle cx="30" cy="246" r="3" fill="#2dd4bf"/><circle cx="30" cy="246" r="3" fill="none" stroke="#2dd4bf" class="ring"/>
<text x="40" y="250" font-size="10.5" letter-spacing="1" fill="#8b9bc2">github.com/Yash151005/KarigarTrust</text>
<g class="ar"><text x="474" y="250" text-anchor="end" font-size="11" font-weight="700" letter-spacing="2" fill="#fbbf24">VIEW REPO ↗</text></g>
</svg>
