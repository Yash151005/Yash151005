<text x="26" y="132" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.35s">DevSecOps assistant: triages CI/CD failures,</text><text x="26" y="153" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.47s">flags risky code, suggests fixes and scores</text><text x="26" y="174" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#b8c4e0" class="in" style="animation-delay:0.59s">release readiness.</text>
