<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="120" viewBox="0 0 1000 120" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#050a18"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1d2b4f" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>
<defs>
  <linearGradient id="tG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
</defs>
<style>
  .fan{animation:fan 3.2s ease-in-out infinite}
  @keyframes fan{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-8px)}}
  .bob{animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  .dot{animation:pl 1.2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.2}50%{opacity:1}}
</style>
<rect x="1" y="1" width="998" height="118" rx="16" fill="url(#panelG)"/>
<rect x="1" y="1" width="998" height="118" rx="16" fill="url(#grid)" opacity="0.45"/>
<rect x="1" y="1" width="998" height="118" rx="16" fill="none" stroke="url(#edgeG)" stroke-opacity="0.7" stroke-width="1.4"/>
<rect x="40" y="30" width="120" height="66" rx="9" fill="#0e1a35" stroke="#3b82f6" stroke-opacity="0.8" class="fan" style="animation-delay:0.00s"/><rect x="54" y="38" width="120" height="66" rx="9" fill="#0e1a35" stroke="#2dd4bf" stroke-opacity="0.8" class="fan" style="animation-delay:0.15s"/><rect x="68" y="46" width="120" height="66" rx="9" fill="#0e1a35" stroke="#fbbf24" stroke-opacity="0.8" class="fan" style="animation-delay:0.30s"/><g class="fan" style="animation-delay:.3s"><rect x="80" y="58" width="60" height="6" rx="3" fill="#e8eefc" fill-opacity=".8"/><rect x="80" y="72" width="88" height="4" rx="2" fill="#8b9bc2"/><rect x="80" y="81" width="70" height="4" rx="2" fill="#8b9bc2"/><circle cx="182" cy="62" r="4" fill="#fbbf24" class="dot"/></g>
<text x="250" y="58" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="url(#tG)">+36 MORE BUILDS</text>
<text x="252" y="86" font-size="12" letter-spacing="2" fill="#8b9bc2">AI &amp; AGENTS · DATA SCIENCE · SOFTWARE &amp; VISION · all public on GitHub</text>
<g class="bob"><text x="960" y="58" text-anchor="end" font-size="12" letter-spacing="2.4" fill="#2dd4bf">CLICK  ▸ MORE_BUILDS  BELOW</text>
<text x="960" y="84" text-anchor="end" font-size="18" fill="#2dd4bf">▼</text></g>
<circle cx="912" cy="79" r="2.5" fill="#2dd4bf" class="dot" style="animation-delay:0.0s"/><circle cx="924" cy="79" r="2.5" fill="#2dd4bf" class="dot" style="animation-delay:0.2s"/><circle cx="936" cy="79" r="2.5" fill="#2dd4bf" class="dot" style="animation-delay:0.4s"/>
</svg>
