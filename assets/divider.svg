<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="16" viewBox="0 0 1000 16" font-family="'JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace" >

<defs>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
  <linearGradient id="panelG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e1a35"/><stop offset="1" stop-color="#050a18"/>
  </linearGradient>
  <linearGradient id="edgeG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f6feb"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/>
  </linearGradient>
  <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
    <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.45"/>
  </linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#1d2b4f" stroke-width="0.6" opacity="0.55"/>
  </pattern>
</defs>
<style>.mv{animation:mv 5s linear infinite}@keyframes mv{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}</style>
<rect x="0" y="7.25" width="1000" height="1.5" fill="url(#edgeG)" opacity="0.45"/>
<g class="mv"><rect x="0" y="6.5" width="120" height="3" rx="1.5" fill="#2dd4bf" filter="url(#glow)" opacity="0.9"/></g>
<rect x="495.0" y="3" width="10" height="10" transform="rotate(45 500.0 8)" fill="#050a18" stroke="#fbbf24" stroke-width="1.4"/>
</svg>
